[project]
name = "agent-platform-api"
version = "0.1.0"
description = "Autonomous agent pipeline platform: API, worker and scheduler"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.142.2",
  "uvicorn[standard]==0.54.0",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "sqlalchemy[asyncio]==2.1.3",
  "asyncpg==0.32.0",
  "alembic==1.20.0",
  "psycopg[binary,pool]==3.3.6",
  "langgraph==1.2.14",
  "langgraph-checkpoint-postgres==3.1.2",
  "mcp==2.3.0",
  "arq==0.28.0",
  "redis>=5,<7",
  "httpx==0.28.1",
  "anthropic==1.11.0",
  "structlog==26.1.0",
  "argon2-cffi==25.1.0",
  "cryptography==50.0.2",
  "jinja2==3.1.6",
  "jsonschema==4.26.0",
  "simpleeval==1.0.8",
  "jsonpath-ng==1.9.1",
  "croniter==6.2.4",
  "prometheus-client==0.26.0",
  "sse-starlette==3.5.0",
  "uuid-utils>=0.10",
  "email-validator>=2.2",
  "opentelemetry-api>=1.30",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.16.10",
  "mypy==2.4.0",
  "types-jsonschema",
  "asgi-lifespan>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "RUF", "N", "SIM", "BLE"]
ignore = ["S101", "S104", "B008", "RUF012", "SIM105", "RUF001", "RUF002", "RUF003", "N818", "S311"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "BLE", "N"]
# Enum members such as `secret_accessed = "secret.accessed"` are event names, not credentials.
"app/core/enums.py" = ["S105"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = false
strict = false
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["app.core.*", "app.tools.*", "app.hitl.*", "app.orchestration.state_machine", "app.secrets.*", "app.llm.*"]
strict = true
disallow_any_generics = false
warn_return_any = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = ["integration: needs Postgres, Redis and mock MCP servers", "real_llm: calls a real provider"]
