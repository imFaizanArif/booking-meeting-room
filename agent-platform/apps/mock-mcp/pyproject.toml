[project]
name = "mock-mcp"
version = "0.1.0"
description = "Deterministic demo MCP servers (jobs, calendar, github) with idempotency-key support"
requires-python = ">=3.12"
dependencies = ["mcp==2.3.0", "uvicorn[standard]==0.54.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mock_mcp"]
